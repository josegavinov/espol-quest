# PostgreSQL 15. Los valores por defecto coinciden con el contenedor descrito
# en el README, y cualquiera se puede sobreescribir por variable de entorno.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "espol" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "espol" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: espol_quest_development

test:
  <<: *default
  database: espol_quest_test

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { nil } %>
  database: espol_quest_production
